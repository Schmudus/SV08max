[gcode_macro poop_wipe]
gcode:
	{% set target_temp = printer[printer.toolhead.extruder].target | float %}
	M118 Poop
    M117 Poop
	M106 S128
	G1 X-4 Y100 F6000					# move to poop position
    {% if target_temp>0 %}
		M109 S{target_temp}
    {% else %}
    	M109 S200
    {% endif %}
    _client_linear_move E=15 F=480		# poop
    _client_linear_move E=-0.2 F=520	# minimal retract to avoid oozing
    M118 Wipe
    M117 Wipe
    G1 X-4 Y75 F6000					# start wipe position
    G1 X-4 Y36 F6000					# wipe
    G1 X-4 Y75
    G1 X-4 Y36
    G1 X-4 Y75
    G1 X-4 Y36
    G1 X-4 Y75
    G1 X-4 Y36
    G1 X-4 Y75
    G1 X-4 Y36
    G1 X-4 Y75
    G1 X-4 Y36
    M106 S0
    G1 X5 Y100 F6000					# move to safe position
    M117								# clear messages
    {% if target_temp>0 %}
		M109 S{target_temp}
    {% else %}
    	M109 S0
    {% endif %}