[gcode_macro G28]
rename_existing: G28.1
gcode:
	status_homing
  	{% set home_all = 'X' not in params and 'Y' not in params and 'Z' not in params %} 	# Check if homing all
  	HIGHCURRENT																			# Set TMC to normal power 
  	SET_KINEMATIC_POSITION Z=0 															# Fake Z position to allow initial movement
  	G91 																				# Relative positioning
  	G1 Z5 F600 																		# Lift Z by 10mm for safety clearance
  	G90 																				# Absolute positioning
  	SET_KINEMATIC_POSITION CLEAR_HOMED=Z 												# Clear fake position immediately so axes show as unhomed

  	{% if home_all or 'X' in params or 'Z' in params %}
    	G28.1 X																			# Home X axis (always forced if Z or X is requested)
  	{% endif %}
    
  	{% if home_all or 'Y' in params or 'Z' in params %}
	 	G1 X375 F10000
    	G28.1 Y 																		# Home Y axis (always forced if Z or Y is requested)
  	{% endif %}
    
  	{% if home_all or 'Z' in params %}
    	SET_KINEMATIC_POSITION Z=10
    	T0
    	M400
    	SET_KINEMATIC_POSITION CLEAR_HOMED=Z
    	M400
    	M109 S150
    	G28.1 Z 																		# Home Z axis
    	G91 # Relative positioning
    	G1 Z7 F600 																		# Lift Z 7mm post-home
    	G90 # Absolute positioning
    	M104 S0
  	{% endif %}
    M400
    status_ready