[gcode_macro GLOBALS]
variable_homing: 0
gcode:

[homing_override]
axes: xyz
gcode:
	status_homing
	BED_MESH_CLEAR
  	{% set home_all = 'X' not in params and 'Y' not in params and 'Z' not in params %} 	# Check if homing all
	SET_GCODE_VARIABLE MACRO=GLOBALS VARIABLE=homing VALUE=1
  	HIGHCURRENT																			# Set TMC to normal power
    G4 P1000																			# 1 second dwell to adjust currents

  	{% if home_all or 'X' in params or 'Y' in params or 'Z' in params %}
    	G28 X																			# Home X axis (always forced if Z or X is requested)
  	{% endif %}
   
  	{% if home_all or 'Y' in params or 'Z' in params %}
	 	G1 X375 F10000																	# Set your X position for Y homing here
    	G28 Y 																		# Home Y axis (always forced if Z or Y is requested)
  		{% if home_all or 'Z' in params %}
        	G1 X250 Y250																# Set your Z-homing position here
  		{% endif %}
    {% endif %}

  	{% if home_all or 'Z' in params %}
    	SET_KINEMATIC_POSITION Z=10
    	T0
    	M400
    	SET_KINEMATIC_POSITION CLEAR_HOMED=Z
    	M400
        status_temp
    	M109 S150
        status_homing
		G1 X250 Y250
    	G28 Z 																		# Home Z axis
        M400
    	G91 # Relative positioning
    	G1 Z7 F600 																		# Lift Z 7mm post-home
    	G90 # Absolute positioning
    	M104 S0
  	{% endif %}
    M400
    G1 F9000
	SET_GCODE_VARIABLE MACRO=GLOBALS VARIABLE=homing VALUE=1
    status_ready
