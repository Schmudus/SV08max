#   mainboard:
#     ls /dev/serial/by-id/*
#     ls /dev/serial/by-path/*
#	  sudo service klipper stop
#     make flash FLASH_DEVICE=/dev/serial/by-id/usb-Klipper_stm32h723xx_2A0010000851323235363233-if00
#	  sudo service klipper start
#
#   heater board
#     Check UUID with
#     ~/klippy-env/bin/python3 ~/klipper/scripts/canbus_query.py
# 
#		~/klippy-env/bin/python3 ~/katapult/scripts/flash_can.py -i can0 -f ~/klipper/out/klipper.bin -u 35cbd4021f2c
#		https://drklipper.de/doku.php?id=klipper_faq:can:66_-_katapult-bootloader


[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32h723xx_2A0010000851323235363233-if00
restart_method:command

[mcu indxmcu]
serial: /dev/serial/by-id/usb-Bondtech_INDX_F48EE1FA4138505320202051330507FF-if00
is_non_critical: True
restart_method:command

[mcu heater]
canbus_uuid: 35cbd4021f2c
canbus_interface: can0
